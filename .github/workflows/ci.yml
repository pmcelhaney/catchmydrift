name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed Action bundle
        run: |
          npm run build:action
          git diff --exit-code -- dist

      - name: Run tests
        run: npm test

      - name: Run Action as a consumer
        id: drift
        uses: ./

      - name: Verify Action artifacts
        env:
          REPORT_DIRECTORY: ${{ steps.drift.outputs.report-directory }}
          DRIFT_DETECTED: ${{ steps.drift.outputs.drift-detected }}
        run: |
          test "$DRIFT_DETECTED" = true -o "$DRIFT_DETECTED" = false
          test -f "$REPORT_DIRECTORY/report.json"
